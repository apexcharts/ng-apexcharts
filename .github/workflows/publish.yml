name: Publish to npm

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check commit message for release trigger
        id: check
        # Pass the commit message via env, never interpolate it into the script.
        # Inlining ${{ github.event.head_commit.message }} pastes attacker- or
        # author-controlled text straight into bash: backticks in a commit body
        # ran as command substitution and failed this step with exit 127, and in
        # a job holding id-token: write that is a command-injection vector, not
        # just a crash.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Only the first line (subject) is the release trigger. Matching the
          # whole message let a body line beginning "release:" publish.
          SUBJECT=$(printf '%s\n' "$COMMIT_MSG" | head -n1)
          if printf '%s' "$SUBJECT" | grep -qE '^release: [0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION=$(printf '%s' "$SUBJECT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ ]*' | head -n1)
            echo "triggered=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            if printf '%s' "$VERSION" | grep -qE '-'; then
              echo "tag=next" >> "$GITHUB_OUTPUT"
            else
              echo "tag=latest" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package.json version matches commit message
        if: steps.check.outputs.triggered == 'true'
        run: |
          PKG_VERSION=$(node -p "require('./projects/ng-apexcharts/package.json').version")
          MSG_VERSION="${{ steps.check.outputs.version }}"
          if [ "$PKG_VERSION" != "$MSG_VERSION" ]; then
            echo "❌ package.json version ($PKG_VERSION) does not match commit message version ($MSG_VERSION)"
            exit 1
          fi
          echo "✅ Version $PKG_VERSION confirmed"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.triggered == 'true'
        with:
          node-version: "24"
          cache: npm

      - run: npm install --legacy-peer-deps
        if: steps.check.outputs.triggered == 'true'

      - run: npm test -- --watch=false --browsers=ChromeHeadless
        if: steps.check.outputs.triggered == 'true'

      - run: npm run package
        if: steps.check.outputs.triggered == 'true'

      - run: npm publish --provenance --tag ${{ steps.check.outputs.tag }}
        if: steps.check.outputs.triggered == 'true'
        working-directory: dist/ng-apexcharts

      - name: Create GitHub release with notes
        if: steps.check.outputs.triggered == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          TAG="v$VERSION"

          # Idempotent: skip if a release for this tag already exists.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          PRERELEASE_FLAG=""
          if echo "$VERSION" | grep -q '[-]'; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Notes come from the CHANGELOG entry for this version; fall back to
          # GitHub's auto-generated notes when no entry exists.
          if node scripts/extract-changelog.js "$VERSION" > /tmp/release-notes.md; then
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md $PRERELEASE_FLAG
          else
            gh release create "$TAG" --title "$TAG" --generate-notes $PRERELEASE_FLAG
          fi
